# biliblil Downloader (웹 버전) — VPS 배포용 Compose
#
#   git clone <이 저장소> /opt/bilibili-downloader && cd /opt/bilibili-downloader
#   mkdir -p /opt/bilibili-downloader-data/downloads
#   docker compose -f docker-compose.vps.yml up -d --build
#
# 선행: bilibili.stlennon.cloud DNS 레코드.
# ⚠ 배포 전 확인할 것 — bilibili 는 데이터센터 IP 를 차단하는 경우가 있습니다.
#   VPS 에서 한 건 받아보고(아래 검증) 실패하면 사내 LAN 유지가 맞습니다.
services:
  bilibili-downloader:
    build: .
    container_name: bilibili-downloader
    restart: unless-stopped
    environment:
      # 받은 파일 보존 시간. 지나면 자동 삭제(디스크 잠식 방지). 0 이면 정리 안 함.
      - BILI_DOWNLOAD_TTL_HOURS=${BILI_DOWNLOAD_TTL_HOURS:-24}
    volumes:
      # 받는 중인 파일이 컨테이너 재기동으로 사라지지 않게. TTL 이 알아서 청소한다.
      - /opt/bilibili-downloader-data/downloads:/app/web/downloads
    networks:
      - hermes-agent-kozy_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.bilibili.rule=Host(`bilibili.stlennon.cloud`)
      - traefik.http.routers.bilibili.entrypoints=websecure
      - traefik.http.routers.bilibili.tls.certresolver=letsencrypt
      - traefik.http.services.bilibili.loadbalancer.server.port=4434
      - traefik.docker.network=hermes-agent-kozy_default
      - traefik.http.routers.bilibili.middlewares=oauth-errors,gauth

networks:
  hermes-agent-kozy_default:
    external: true
